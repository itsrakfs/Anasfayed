:root {
  --bg: #050505;
  --bg-2: #0b0b0b;
  --card: #101010;
  --accent: #8b1a32;        /* deep burgundy: fills, buttons */
  --accent-hover: #a62340;
  --accent-text: #e8607a;   /* lighter wine-rose: text and highlights (readable on black) */
  --accent-dim: rgba(232, 96, 122, 0.14);
  --text: #f5f5f5;
  --muted: #a1a1aa;
  --border: #1f1f23;

  --gutter: 20px;
  --header-h: 68px;
  --radius: 16px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: var(--header-h); background: var(--bg); }

body {

  font-family: var(--font-sans); font-size: 1rem; line-height: 1.65;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
img, svg, canvas { display: block; max-width: 100%; }
h1, h2, p, dl, dd, dt { margin: 0; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
.mono { font-family: var(--font-mono); letter-spacing: 0.02em; }
.wrap { width: 100%; max-width: 1100px; margin-inline: auto; padding-inline: var(--gutter); }
.narrow { max-width: 760px; }
::selection { background: var(--accent); color: #fff; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; border-radius: 6px; }

.skip-link { position: fixed; left: 12px; top: -60px; z-index: 200; background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 8px; font-weight: 600; transition: top 0.2s; }
.skip-link:focus { top: 12px; }
.noscript { padding: 12px var(--gutter); color: var(--muted); text-align: center; font-size: 0.9rem; }

.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; }

.brand:hover .brand-name { opacity: 0.85; }
.bar-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 999px; font-size: 0.8rem; color: var(--muted); transition: color 0.2s, border-color 0.2s; }
.bar-link:hover { color: var(--accent-text); border-color: var(--accent-text); }

/* Hero */
.hero { position: relative; min-height: 100svh; min-height: 100vh; display: flex; align-items: center; padding: calc(var(--header-h) + 24px) 0 72px; overflow: hidden; isolation: isolate; }
.hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; }

.hero-inner { display: grid; justify-items: center; text-align: center; gap: 0; }
.hero-title { font-family: var(--font-display); font-size: clamp(2.8rem, 13.5vw, 7.2rem); line-height: 1.02; letter-spacing: -0.045em; font-weight: 700; }
.dot { color: var(--accent-text); -webkit-text-fill-color: var(--accent-text); }
.hero-rule { display: block; width: 72px; height: 3px; margin-top: 26px; border-radius: 3px; background: linear-gradient(90deg, #ff9aaf, var(--accent)); }
.grad { background: linear-gradient(100deg, #ff9aaf 0%, #e8607a 55%, #c93a5c 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero-tag { margin-top: 22px; font-size: 0.85rem; color: var(--accent-text); }
.hero-intro { margin-top: 20px; max-width: 44ch; color: var(--muted); font-size: clamp(1rem, 2.6vw, 1.15rem); }
.hero-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 34px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 14px 26px; border-radius: 999px; border: 1px solid transparent; font-weight: 600; font-size: 0.97rem; cursor: pointer; white-space: nowrap; transition: background 0.25s, color 0.25s, border-color 0.25s, transform 0.25s var(--ease); }
.btn-primary { background: var(--accent); color: #fff; border-color: rgba(232,96,122,0.35); }
.btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); }
.btn-ghost { border-color: var(--border-strong); background: rgba(16,16,16,0.6); }
.btn-ghost:hover { border-color: var(--accent-text); color: var(--accent-text); transform: translateY(-2px); }
@media (max-width: 420px) { .hero-actions .btn { width: 100%; } }

/* Sections */
.section { padding: 80px 0; }
.section-alt { background: var(--bg-2); border-block: 1px solid var(--border); }
@media (min-width: 860px) { :root { --gutter: 32px; --header-h: 76px; } .section { padding: 112px 0; } }

.head h2 { font-size: clamp(1.8rem, 6vw, 2.6rem); letter-spacing: -0.035em; line-height: 1.1; }

/* About facts */
.facts { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); overflow: hidden; }
.fact { display: grid; gap: 4px; padding: 18px 22px; border-bottom: 1px solid var(--border); }
.fact:last-child { border-bottom: 0; }
.fact dt { font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-text); }

@media (min-width: 640px) { .fact { grid-template-columns: 200px 1fr; align-items: baseline; gap: 24px; } }

@media (min-width: 640px) { .cards { grid-template-columns: repeat(2, 1fr); } }

.ico-btn:hover { background: linear-gradient(145deg, #c93a5c, #8b1a32); border-color: transparent; color: #fff; transform: translateY(-4px); box-shadow: 0 14px 30px -12px rgba(201,58,92,0.7); }

.js .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }

  .js .anim, .js .reveal { opacity: 1 !important; transform: none !important; }

    github: [["path", { fill: "currentColor", d: "M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" }]],

      ["rect", line({ x: "3", y: "5", width: "18", height: "14", rx: "2.6" })],
      ["path", line({ d: "M3.8 7.4 12 13.2l8.2-5.8" })]
    ]
  };
  var SVGNS = "http://www.w3.org/2000/svg";
  function svgIcon(key) {
    var parts = ICONS[key];
    if (!parts) return null;
    var svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    svg.setAttribute("focusable", "false");
    parts.forEach(function (p) {
      var el = document.createElementNS(SVGNS, p[0]);
      Object.keys(p[1]).forEach(function (k) { el.setAttribute(k, p[1][k]); });
      svg.appendChild(el);
    });
    return svg;
  }
  function linkFor(key) { return key === "email" ? emailHref(LINKS.email) : safeUrl(LINKS[key]); }
  function extAttrs(href) { return /^https?:/i.test(href) ? { target: "_blank", rel: "noopener noreferrer" } : {}; }

  /* ---------- Content ---------- */
  function renderHero() {
    if (CFG.name) {
      var title = $("#hero-title"), parts = String(CFG.name).trim().split(" ");
      var last = parts.length > 1 ? parts.pop() : "";
      title.textContent = parts.join(" ") + (last ? " " : "");
      if (last) title.appendChild(h("span", { class: "grad", text: last }));
      title.appendChild(h("span", { class: "dot", text: "." }));
    }
    var tag = $("#hero-tag"), intro = $("#hero-intro");
    if (CFG.tagline) tag.textContent = CFG.tagline; else tag.hidden = true;
    if (CFG.intro) intro.textContent = CFG.intro; else intro.hidden = true;
  }

  function renderFacts() {
    var a = CFG.about || {};
    var rows = [
      ["Full name", a.fullName],
      ["Born", a.born],
      ["Birthplace", a.birthplace],
      ["From", a.from],
      ["Studying", a.faculty],
      ["University", a.university],
      ["Expected graduation", a.graduation],
      ["Current stage", a.currentStage]
    ].filter(function (r) { return r[1]; });

    var list = $("#facts");
    if (!rows.length) { $("#about").hidden = true; return; }
    rows.forEach(function (r) {
      list.appendChild(h("div", { class: "fact" }, [h("dt", { text: r[0] }), h("dd", { text: r[1] })]));
    });
  }

  function renderCards() {
    var wrap = $("#cards");
    (CFG.linkOrder || Object.keys(LINKS)).forEach(function (key) {
      var meta = META[key] || { label: key };
      var href = linkFor(key);
      if (!href) return; // missing link → card simply doesn't exist
      var handle = key === "email" ? String(LINKS.email).trim() : pretty(href);
      var attrs = Object.assign({ class: "card", href: href, "aria-label": meta.label + ": " + handle }, extAttrs(href));
      var ico = h("span", { class: "ico", "aria-hidden": "true" });
      var icon = svgIcon(key);
      if (icon) ico.appendChild(icon);
      wrap.appendChild(h("a", attrs, [
        ico,
        h("span", { class: "card-text" }, [h("span", { class: "card-name", text: meta.label }), h("span", { class: "card-handle mono", text: handle })]),
        h("span", { class: "card-arrow", "aria-hidden": "true", text: "↗" })
      ]));
    });
    if (!wrap.children.length) { $("#links").hidden = true; var l = document.querySelector(".bar-link"); if (l) l.hidden = true; }
  }

  /* Round icon buttons under the hero buttons */
  function renderHeroSocial() {
    var box = $("#hero-social");
    if (!box) return;
    (CFG.linkOrder || Object.keys(LINKS)).forEach(function (key) {
      var href = linkFor(key), icon = svgIcon(key);
      if (!href || !icon) return;
      var label = (META[key] || { label: key }).label;
      box.appendChild(h("a", Object.assign({ class: "ico-btn", href: href, "aria-label": label, title: label }, extAttrs(href)), [icon]));
    });
    if (!box.children.length) box.hidden = true;
  }

  /* ---------- Header + reveal ---------- */
  function initScroll() {
    var header = $("#site-header");
    function onScroll() { header.classList.toggle("is-scrolled", window.scrollY > 12); }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();

    var items = Array.prototype.slice.call(document.querySelectorAll(".reveal"));
    if (!("IntersectionObserver" in window) || reduceMotion.matches) {
      items.forEach(function (el) { el.classList.add("is-visible"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("is-visible"); io.unobserve(en.target); }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
    items.forEach(function (el) { io.observe(el); });
  }

  /* ---------- Hero network (light, pauses when hidden) ---------- */
  function initNetwork() {
    var canvas = $("#hero-canvas"), hero = $(".hero");
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");
    var COLOR = "232,96,122";
    var w = 0, hh = 0, nodes = [], raf = 0, running = false, inView = true, last = 0;

    function rand(a, b) { return a + Math.random() * (b - a); }
    function build() {
      var r = hero.getBoundingClientRect();
      w = Math.max(1, Math.floor(r.width)); hh = Math.max(1, Math.floor(r.height));
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(w * dpr); canvas.height = Math.floor(hh * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var count = Math.round(Math.min(64, Math.max(22, (w * hh) / 20000)));
      nodes = [];
      for (var i = 0; i < count; i++) {
        var big = Math.random() < 0.14;
        nodes.push({ x: rand(0, w), y: rand(0, hh), vx: rand(-0.11, 0.11), vy: rand(-0.11, 0.11), r: big ? rand(2.4, 3.3) : rand(1.1, 1.8), big: big });
      }
    }
    function draw(step) {
      ctx.clearRect(0, 0, w, hh);
      var link = Math.min(150, Math.max(95, w * 0.14)), l2 = link * link, i, j, a, b;
      for (i = 0; i < nodes.length; i++) {
        a = nodes[i];
        if (step) {
          a.x += a.vx * step; a.y += a.vy * step;
          if (a.x < -10) a.x = w + 10; else if (a.x > w + 10) a.x = -10;
          if (a.y < -10) a.y = hh + 10; else if (a.y > hh + 10) a.y = -10;
        }
      }
      ctx.lineWidth = 1;
      for (i = 0; i < nodes.length; i++) {
        a = nodes[i];
        for (j = i + 1; j < nodes.length; j++) {
          b = nodes[j];
          var dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
          if (d2 < l2) {
            ctx.strokeStyle = "rgba(" + COLOR + "," + ((1 - d2 / l2) * 0.34).toFixed(3) + ")";
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      for (i = 0; i < nodes.length; i++) {
        a = nodes[i];
        ctx.fillStyle = "rgba(" + COLOR + "," + (a.big ? 0.95 : 0.55) + ")";
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 6.2832); ctx.fill();
        if (a.big) { ctx.strokeStyle = "rgba(" + COLOR + ",0.25)"; ctx.beginPath(); ctx.arc(a.x, a.y, a.r + 5, 0, 6.2832); ctx.stroke(); }
      }
    }
    function frame(t) {
      if (!running) return;
      var step = Math.min((t - last) / 16.67, 3); last = t;
      draw(step); raf = requestAnimationFrame(frame);
    }
    function start() { if (running || reduceMotion.matches || !inView || document.hidden) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
    function stop() { running = false; cancelAnimationFrame(raf); }

    var timer = 0;
    window.addEventListener("resize", function () {
      clearTimeout(timer);
      timer = setTimeout(function () { stop(); build(); draw(0); start(); }, 150);
    });
    document.addEventListener("visibilitychange", function () { if (document.hidden) stop(); else start(); });
    if ("IntersectionObserver" in window) {
      new IntersectionObserver(function (e) { inView = e[0].isIntersecting; if (inView) start(); else stop(); }).observe(hero);
    }
    function onMotion() { if (reduceMotion.matches) { stop(); draw(0); } else start(); }
    if (reduceMotion.addEventListener) reduceMotion.addEventListener("change", onMotion);

    build(); draw(0); start();
  }

  /* ---------- Boot ---------- */
  function boot() {
    var y = $("#year"); if (y) y.textContent = String(new Date().getFullYear());
    renderHero(); renderFacts(); renderCards(); renderHeroSocial();
    initScroll(); initNetwork();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();

</script>
